<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — NULLBANKER</title>
<link rel="icon" href="/img/logo.png" data-fallback="/img/logo.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo"><img src="/img/logo.png" alt="NullBanker" data-fallback="/img/logo.svg" /><span class="logo-text">NULLBANKER</span></a>
    <nav class="mainnav">
      <a href="/">Início</a>
      <a href="/produtos.html">Produtos</a>
      <a href="/suporte.html">Suporte</a>
    </nav>
    <div class="topbar-actions" data-auth-slot></div>
    <button class="navtoggle">menu</button>
  </div>
</header>

<section style="padding-top:80px;border-bottom:none;">
  <div class="wrap auth-wrap">
    <img class="auth-modal-logo" src="/img/logo.png" data-fallback="/img/logo.svg" alt="NullBanker" style="width:84px;height:84px;margin:0 auto 18px;" />
    <div class="eyebrow-num center-text">Acesso</div>
    <h2 class="center-text">Entrar</h2>
    <div class="auth-box mt-40">
      <div class="msg" id="loginError"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
      </form>
    </div>
    <div class="auth-switch">Ainda não tem conta? <a href="/registro.html" id="toRegister">Criar conta</a></div>
  </div>
</section>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("loginError");
    errorBox.textContent = "";
    errorBox.classList.remove("error");
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "Entrando...";

    try {
      const data = await API.post("/auth/login", {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      API.setToken(data.token);
      API.setUser(data.user);
      window.location.href = safeNext(qs("next")) || (data.user.isAdmin ? "/admin.html" : "/");
    } catch (err) {
      errorBox.textContent = err.message || "Não foi possível entrar.";
      errorBox.classList.add("error");
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
  const nextParam = qs("next");
  if (nextParam) document.getElementById("toRegister").href = "/registro.html?next=" + encodeURIComponent(nextParam);
</script>
</body>
</html>
