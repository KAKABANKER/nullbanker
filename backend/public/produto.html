<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Produto — NULLBANKER</title>
<link rel="icon" href="/img/logo.png" data-fallback="/img/logo.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="/" class="logo"><img src="/img/logo.png" alt="NullBanker" data-fallback="/img/logo.svg" /><span class="logo-text">NULLBANKER</span></a>
    <nav class="mainnav">
      <a href="/">Início</a>
      <a href="/produtos.html" class="active">Produtos</a>
      <a href="/suporte.html">Suporte</a>
    </nav>
    <div class="topbar-actions" data-auth-slot></div>
    <button class="navtoggle">menu</button>
  </div>
</header>

<section style="padding-top:56px;">
  <div class="wrap two-col" id="productWrap">
    <div class="empty-state"><span class="spinner-line">carregando produto...</span></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 NULLBANKER.</span>
      <span>desenvolvido por nuitbanker</span>
    </div>
  </div>
</footer>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script>
  // Número máximo de parcelas oferecidas no cartão (1 = só à vista).
  // Só aumente depois de confirmar com a Plumify que o parcelamento está
  // habilitado na sua conta e se há juros.
  const MAX_INSTALLMENTS = 1;
  const MIN_INSTALLMENT_VALUE = 50;

  // 🔎 NOVO — limite da descrição "curta" na página. Acima disso mostra o botão.
  const DESCRIPTION_LIMIT = 280;

  let cardMode = "redirect"; // "form" = cartão digitado no site (Plumify) | "redirect" = Stripe
  let currentProduct = null;
  let selectedPayment = null;
  let slideIndex = 0;
  let slideImages = [];

  // 🔎 NOVO — bandeiras detectáveis pelo número do cartão (BIN/prefixo + comprimento).
  // A ordem importa: Elo/Mastercard podem compartilhar prefixos com outras, então
  // verificamos as mais específicas primeiro.
  const CARD_BRANDS = [
    {
      name: "visa",
      label: "Visa",
      test: (d) => /^4/.test(d),
      lengths: [13, 16, 19],
    },
    {
      name: "mastercard",
      label: "Mastercard",
      // 51-55 e 2221-2720
      test: (d) => {
        const n2 = Number(d.slice(0, 2));
        const n4 = Number(d.slice(0, 4));
        return (n2 >= 51 && n2 <= 55) || (n4 >= 2221 && n4 <= 2720);
      },
      lengths: [16],
    },
    {
      name: "amex",
      label: "Amex",
      test: (d) => /^3[47]/.test(d),
      lengths: [15],
    },
    {
      name: "elo",
      label: "Elo",
      test: (d) =>
        /^(4011|4312|4389|4514|4573|4576|5067|5090|6277|6362|6363|650|651|655)/.test(d),
      lengths: [16],
    },
    {
      name: "hipercard",
      label: "Hipercard",
      test: (d) => /^(606282|3841)/.test(d),
      lengths: [16],
    },
    {
      name: "diners",
      label: "Diners",
      test: (d) => /^3(0[0-5]|[68])/.test(d),
      lengths: [14, 16],
    },
    {
      name: "discover",
      label: "Discover",
      test: (d) => /^(6011|65|64[4-9])/.test(d),
      lengths: [16, 19],
    },
  ];

  function detectCardBrand(digits) {
    if (!digits) return null;
    const ordered = CARD_BRANDS.slice().sort((a, b) => (b.test(digits) ? 1 : 0) - (a.test(digits) ? 1 : 0));
    return ordered.find((b) => b.test(digits)) || null;
  }

  function renderSlider(images) {
    if (!images.length) return "";
    return `
      <div class="slider" id="productSlider">
        <div class="slider-track" id="sliderTrack">
          ${images.map((src) => `<div class="slide"><img src="${esc(src)}" alt="Foto do projeto" /></div>`).join("")}
        </div>
        ${images.length > 1 ? `
          <button type="button" class="slider-arrow prev" id="sliderPrev" aria-label="Foto anterior">‹</button>
          <button type="button" class="slider-arrow next" id="sliderNext" aria-label="Próxima foto">›</button>
          <div class="slider-dots" id="sliderDots">
            ${images.map((_, i) => `<span class="slider-dot ${i === 0 ? "active" : ""}" data-i="${i}"></span>`).join("")}
          </div>
        ` : ""}
      </div>
    `;
  }

  function goToSlide(i) {
    slideIndex = (i + slideImages.length) % slideImages.length;
    const track = document.getElementById("sliderTrack");
    if (track) track.style.transform = `translateX(-${slideIndex * 100}%)`;
    document.querySelectorAll(".slider-dot").forEach((dot, idx) => {
      dot.classList.toggle("active", idx === slideIndex);
    });
  }

  function bindSlider() {
    const prev = document.getElementById("sliderPrev");
    const next = document.getElementById("sliderNext");
    if (prev) prev.addEventListener("click", () => goToSlide(slideIndex - 1));
    if (next) next.addEventListener("click", () => goToSlide(slideIndex + 1));
    document.querySelectorAll(".slider-dot").forEach((dot) => {
      dot.addEventListener("click", () => goToSlide(Number(dot.dataset.i)));
    });
  }

  // 🔎 NOVO — descrição com truncamento e botão "ver descrição completa".
  // Usa o `shortDesc` como resumo e a `description` completa no expandido.
  function renderDescription(p) {
    const long = String(p.description || "");
    const short = String(p.shortDesc || "");
    const needsToggle = long.length > DESCRIPTION_LIMIT;
    const initial = needsToggle ? long.slice(0, DESCRIPTION_LIMIT).trimEnd() + "…" : long;
    return `
      <div class="product-desc" id="productDesc" data-full="${esc(long)}">
        <p class="lede" id="descShort">${short ? esc(short) : ""}</p>
        <p class="product-desc-text" id="descLong" style="display:none;">${esc(initial)}</p>
        ${needsToggle ? `<button type="button" class="btn btn-outline btn-sm product-desc-toggle" id="descToggle">Ver descrição completa</button>` : ""}
      </div>
    `;
  }

  function bindDescription() {
    const toggle = document.getElementById("descToggle");
    const long = document.getElementById("descLong");
    const short = document.getElementById("descShort");
    if (!toggle || !long) return;
    const full = long.parentElement.getAttribute("data-full") || "";
    let expanded = false;
    toggle.addEventListener("click", () => {
      expanded = !expanded;
      if (expanded) {
        long.textContent = full;
        long.style.display = "block";
        if (short) short.style.display = "none";
        toggle.textContent = "Ver menos";
      } else {
        long.textContent = full.slice(0, DESCRIPTION_LIMIT).trimEnd() + "…";
        long.style.display = "none";
        if (short) short.style.display = "block";
        toggle.textContent = "Ver descrição completa";
      }
    });
  }

  // 🔎 NOVO — busca de CEP via ViaCEP. Devolve o objeto com logradouro/bairro/localidade/uf
  // ou null se o CEP não for encontrado. Se a rede falhar, devolve null (fallback manual).
  async function buscarCep(cepDigits) {
    try {
      const res = await fetch(`https://viacep.com.br/ws/${cepDigits}/json/`);
      if (!res.ok) return null;
      const data = await res.json();
      if (data.erro) return null;
      return data;
    } catch (e) {
      return null;
    }
  }

  function renderProduct(p) {
    const wrap = document.getElementById("productWrap");
    slideImages = [p.imageUrl, ...(p.images || [])].filter(Boolean);

    wrap.innerHTML = `
      <div>
        ${slideImages.length ? renderSlider(slideImages) : `<div class="product-hero-media"><img src="/img/fedora.svg" alt="" style="width:42%;height:auto;object-fit:contain;filter:none;opacity:.7" /></div>`}
        <div class="eyebrow-num mt-40">Produto</div>
        <h2>${esc(p.name)} ${p.isFree ? '<span class="price-free" style="margin-left:10px;">GRÁTIS</span>' : ""}</h2>

        ${renderDescription(p)}

        <ul class="feature-list">
          ${(p.features || []).map((f) => `<li>${esc(f)}</li>`).join("")}
        </ul>
      </div>
      <div>
        <div class="checkout-card">
          <div class="checkout-head">
            <span class="eyebrow-num" style="margin:0;">resumo do pedido</span>
            <h3 style="margin:6px 0 0;">${esc(p.name)}</h3>
          </div>
          <div class="checkout-price-row">
            <span>Valor total</span>
            <span class="checkout-price">${p.isFree ? "GRÁTIS" : formatBRL(p.price)}</span>
          </div>

          <div id="buyGate">
            ${p.isFree
              ? `<button type="button" class="btn btn-primary btn-block" id="freeDownloadBtn" ${p.hasDownload ? "" : "disabled"}>${p.hasDownload ? "Baixar grátis" : "Download em breve"}</button>
                 <p class="checkout-note">Grátis, mas é preciso estar logado para baixar.</p>`
              : `<button type="button" class="btn btn-primary btn-block" id="startBuyBtn">Comprar agora</button>
                 <p class="checkout-note">Para comprar é preciso entrar ou criar uma conta. Leva menos de um minuto.</p>`}
          </div>

          <div id="ownedBox" style="display:none;">
            <p class="owned-note" style="margin-bottom:14px;">✓ Você já tem este site</p>
            <button type="button" class="btn btn-primary btn-block" id="ownedDownloadBtn">Baixar agora</button>
            <p class="checkout-note">Também fica em Minha conta &rarr; Meus Sites.</p>
          </div>

          <form id="orderForm" style="display:none;">
            <div class="field">
              <label for="customerName">Nome completo</label>
              <input type="text" id="customerName" required />
            </div>
            <div class="field">
              <label for="customerEmail">E-mail</label>
              <input type="email" id="customerEmail" required />
            </div>

            <label>Forma de pagamento</label>
            <div class="pay-options">
              <button type="button" class="pay-option" data-method="credit_card">
                <strong>Cartão de crédito</strong>
                <span>${cardMode === "form" ? "Pagamento direto no site" : "Checkout seguro via Stripe"}</span>
              </button>
              <button type="button" class="pay-option" data-method="pix">
                <strong>Pix</strong>
                <span>QR Code gerado na hora</span>
              </button>
            </div>

            <div id="cardFields" style="display:none;">
              <div class="field">
                <label for="cardNumber">Número do cartão</label>
                <div class="input-with-badge">
                  <input type="text" id="cardNumber" inputmode="numeric" autocomplete="cc-number" maxlength="23" placeholder="0000 0000 0000 0000" />
                  <!-- 🔎 NOVO: bandeira detectada -->
                  <span class="card-brand-badge" id="cardBrandBadge" aria-live="polite"></span>
                </div>
              </div>
              <div class="field">
                <label for="cardHolder">Nome impresso no cartão</label>
                <input type="text" id="cardHolder" autocomplete="cc-name" />
              </div>
              <div class="two-col-even">
                <div class="field">
                  <label for="cardExp">Validade</label>
                  <input type="text" id="cardExp" inputmode="numeric" autocomplete="cc-exp" maxlength="5" placeholder="MM/AA" />
                </div>
                <div class="field">
                  <label for="cardCvv">CVV</label>
                  <input type="text" id="cardCvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="000" />
                </div>
              </div>
              <div class="field" id="installmentsField" style="display:none;">
                <label for="cardInstallments">Parcelas</label>
                <select id="cardInstallments"></select>
              </div>
            </div>

            <div class="field" id="pixFields" style="display:none;">
              <label for="cpf">CPF</label>
              <input type="text" id="cpf" placeholder="Somente números" />
            </div>
            <div class="field" id="phoneField" style="display:none;">
              <label for="customerPhone">Telefone (com DDD)</label>
              <input type="tel" id="customerPhone" placeholder="(00) 00000-0000" />
            </div>
            <div id="addressFields" style="display:none;">
              <!-- 🔎 NOVO: CEP com botão de busca -->
              <div class="field">
                <label for="addrZip">CEP</label>
                <div class="input-with-btn">
                  <input type="text" id="addrZip" inputmode="numeric" placeholder="00000-000" maxlength="9" />
                  <button type="button" class="btn btn-outline btn-sm" id="addrZipSearch">Buscar</button>
                </div>
                <p class="helper" id="addrZipHint" style="margin:8px 0 0;"></p>
              </div>
              <div class="two-col-inline">
                <div class="field"><label for="addrStreet">Rua</label><input type="text" id="addrStreet" /></div>
                <div class="field"><label for="addrNumber">Número</label><input type="text" id="addrNumber" /></div>
              </div>
              <div class="field"><label for="addrNeighborhood">Bairro</label><input type="text" id="addrNeighborhood" /></div>
              <div class="two-col-inline">
                <div class="field"><label for="addrCity">Cidade</label><input type="text" id="addrCity" /></div>
                <div class="field"><label for="addrState">Estado (UF)</label><input type="text" id="addrState" maxlength="2" placeholder="SP" /></div>
              </div>
            </div>

            <div class="msg" id="orderError"></div>

            <button type="submit" class="btn btn-primary btn-block" id="orderSubmit" disabled>
              Selecione uma forma de pagamento
            </button>
            <p class="checkout-note">🔒 Pagamento processado por gateway segura. O site não guarda o número completo nem o CVV do cartão.</p>
          </form>

          <div id="pixResult" style="display:none;">
            <div class="checkout-price-row" style="border-top:none;">
              <span>Pix gerado</span>
              <span class="checkout-price" id="pixAmount"></span>
            </div>
            <img id="pixQr" alt="QR Code Pix" style="max-width:200px;margin:0 auto 16px;border:1px solid var(--gold);display:block;background:#fff;padding:6px;" />
            <label>Copia e cola</label>
            <textarea id="pixCode" rows="3" readonly></textarea>
            <button class="btn btn-outline btn-block mt-40" id="copyPix" type="button">Copiar código Pix</button>
          </div>
        </div>
      </div>
    `;

    if (slideImages.length > 1) bindSlider();

    bindDescription();
    setupInstallments(p.price);
    bindCardMasks();
    setupGate(p);

    document.querySelectorAll(".pay-option").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pay-option").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedPayment = btn.dataset.method;
        const isPix = selectedPayment === "pix";
        const isCardForm = selectedPayment === "credit_card" && cardMode === "form";
        const needsBilling = isPix || isCardForm;
        document.getElementById("pixFields").style.display = needsBilling ? "block" : "none";
        document.getElementById("phoneField").style.display = needsBilling ? "block" : "none";
        document.getElementById("addressFields").style.display = needsBilling ? "block" : "none";
        document.getElementById("cardFields").style.display = isCardForm ? "block" : "none";
        const submitBtn = document.getElementById("orderSubmit");
        submitBtn.disabled = false;
        submitBtn.textContent = submitLabel();
      });
    });

    document.getElementById("orderForm").addEventListener("submit", handleSubmit);

    // 🔎 NOVO: busca de CEP
    const zipInput = document.getElementById("addrZip");
    const zipSearch = document.getElementById("addrZipSearch");
    const zipHint = document.getElementById("addrZipHint");

    function formatCep(v) {
      const d = String(v || "").replace(/\D/g, "").slice(0, 8);
      return d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d;
    }
    zipInput.addEventListener("input", () => { zipInput.value = formatCep(zipInput.value); });

    async function doZipLookup() {
      const digits = zipInput.value.replace(/\D/g, "");
      zipHint.textContent = "";
      zipHint.style.color = "";
      if (digits.length !== 8) {
        zipHint.textContent = "Digite um CEP com 8 dígitos.";
        zipHint.style.color = "#ffa8b4";
        return;
      }
      zipSearch.disabled = true;
      const original = zipSearch.textContent;
      zipSearch.textContent = "Buscando...";
      const data = await buscarCep(digits);
      zipSearch.disabled = false;
      zipSearch.textContent = original;
      if (!data) {
        zipHint.textContent = "CEP não encontrado. Preencha o endereço manualmente.";
        zipHint.style.color = "#ffa8b4";
        return;
      }
      if (data.logradouro) document.getElementById("addrStreet").value = data.logradouro;
      if (data.bairro) document.getElementById("addrNeighborhood").value = data.bairro;
      if (data.localidade) document.getElementById("addrCity").value = data.localidade;
      if (data.uf) document.getElementById("addrState").value = data.uf;
      zipHint.textContent = "Endereço preenchido. Confira o número e complemento.";
      zipHint.style.color = "var(--ok)";
      document.getElementById("addrNumber").focus();
    }
    zipSearch.addEventListener("click", doZipLookup);
    zipInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); doZipLookup(); }
    });
  }


  // ---------- trava de login: comprar e baixar só logado ----------
  function setupGate(p) {
    const freeBtn = document.getElementById("freeDownloadBtn");
    if (freeBtn) freeBtn.addEventListener("click", () => NB.download(p.id, freeBtn));

    const buyBtn = document.getElementById("startBuyBtn");
    if (buyBtn) {
      buyBtn.addEventListener("click", () => {
        NB.requireLogin("Entre ou crie sua conta para comprar este site.", (user) => openCheckout(user));
      });
    }

    const ownedBtn = document.getElementById("ownedDownloadBtn");
    if (ownedBtn) ownedBtn.addEventListener("click", () => NB.download(p.id, ownedBtn));

    // Quem já comprou vê o botão de baixar no lugar do checkout.
    if (!p.isFree && isLoggedIn()) {
      API.get("/library").then(({ sites }) => {
        const owned = sites.find((x) => x.id === p.id && x.source === "purchase");
        if (owned && owned.hasDownload) {
          document.getElementById("buyGate").style.display = "none";
          document.getElementById("orderForm").style.display = "none";
          document.getElementById("ownedBox").style.display = "block";
        }
      }).catch(() => {});
    }
  }

  function openCheckout(user) {
    document.getElementById("buyGate").style.display = "none";
    const form = document.getElementById("orderForm");
    form.style.display = "block";
    const nameInput = document.getElementById("customerName");
    const emailInput = document.getElementById("customerEmail");
    if (user && !nameInput.value) nameInput.value = user.name || "";
    if (user && !emailInput.value) emailInput.value = user.email || "";
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function submitLabel() {
    if (selectedPayment === "pix") return "Gerar Pix";
    if (selectedPayment === "credit_card" && cardMode === "form") return `Pagar ${formatBRL(currentProduct.price)}`;
    return "Ir para pagamento seguro";
  }

  function setupInstallments(price) {
    const max = Math.max(1, Math.min(12, MAX_INSTALLMENTS));
    const select = document.getElementById("cardInstallments");
    const options = [];
    for (let n = 1; n <= max; n++) {
      if (n > 1 && price / n < MIN_INSTALLMENT_VALUE) break;
      options.push(`<option value="${n}">${n === 1 ? "À vista" : `${n}x de ${formatBRL(price / n)}`} </option>`);
    }
    select.innerHTML = options.join("");
    document.getElementById("installmentsField").style.display = options.length > 1 ? "block" : "none";
  }

  // 🔎 NOVO — máscara do cartão + detecção da bandeira + limpeza visual da bandeira
  function bindCardMasks() {
    const num = document.getElementById("cardNumber");
    const exp = document.getElementById("cardExp");
    const cvv = document.getElementById("cardCvv");
    const brandBadge = document.getElementById("cardBrandBadge");

    function updateBrand() {
      if (!brandBadge) return;
      const digits = num.value.replace(/\D/g, "");
      const brand = detectCardBrand(digits);
      if (brand) {
        brandBadge.textContent = brand.label;
        brandBadge.className = "card-brand-badge known " + brand.name;
      } else {
        brandBadge.textContent = "";
        brandBadge.className = "card-brand-badge";
      }
    }

    num.addEventListener("input", () => {
      num.value = num.value.replace(/\D/g, "").slice(0, 19).replace(/(.{4})/g, "$1 ").trim();
      updateBrand();
    });
    exp.addEventListener("input", () => {
      const d = exp.value.replace(/\D/g, "").slice(0, 4);
      exp.value = d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
    });
    cvv.addEventListener("input", () => {
      cvv.value = cvv.value.replace(/\D/g, "").slice(0, 4);
    });

    updateBrand();
  }

  function luhnOk(digits) {
    let sum = 0, alt = false;
    for (let i = digits.length - 1; i >= 0; i--) {
      let n = Number(digits[i]);
      if (alt) { n *= 2; if (n > 9) n -= 9; }
      sum += n;
      alt = !alt;
    }
    return sum % 10 === 0;
  }

  function clearCardFields() {
    ["cardNumber", "cardHolder", "cardExp", "cardCvv"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });
    const brandBadge = document.getElementById("cardBrandBadge");
    if (brandBadge) { brandBadge.textContent = ""; brandBadge.className = "card-brand-badge"; }
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const errorBox = document.getElementById("orderError");
    errorBox.classList.remove("error");
    errorBox.textContent = "";

    const customerName = document.getElementById("customerName").value.trim();
    const customerEmail = document.getElementById("customerEmail").value.trim();

    if (!customerName || !customerEmail || !selectedPayment) {
      errorBox.textContent = "Preencha os dados e escolha a forma de pagamento.";
      errorBox.classList.add("error");
      return;
    }

    const payload = {
      productId: currentProduct.id,
      paymentMethod: selectedPayment,
      customerName,
      customerEmail,
    };

    const isCardForm = selectedPayment === "credit_card" && cardMode === "form";

    if (selectedPayment === "pix" || isCardForm) {
      const cpf = document.getElementById("cpf").value.trim();
      const customerPhone = document.getElementById("customerPhone").value.trim();
      const address = {
        zipCode: document.getElementById("addrZip").value.trim(),
        street: document.getElementById("addrStreet").value.trim(),
        number: document.getElementById("addrNumber").value.trim(),
        neighborhood: document.getElementById("addrNeighborhood").value.trim(),
        city: document.getElementById("addrCity").value.trim(),
        state: document.getElementById("addrState").value.trim(),
      };
      if (!cpf || !customerPhone || Object.values(address).some((v) => !v)) {
        errorBox.textContent = "Preencha CPF, telefone e o endereço completo para continuar.";
        errorBox.classList.add("error");
        return;
      }
      payload.cpf = cpf;
      payload.customerPhone = customerPhone;
      payload.address = address;
    }

    if (isCardForm) {
      const number = document.getElementById("cardNumber").value.replace(/\D/g, "");
      const holderName = document.getElementById("cardHolder").value.trim();
      const exp = document.getElementById("cardExp").value;
      const cvv = document.getElementById("cardCvv").value.replace(/\D/g, "");
      const [mm, yy] = exp.split("/");
      const month = Number(mm);
      const year = 2000 + Number(yy);

      const fail = (msg) => {
        errorBox.textContent = msg;
        errorBox.classList.add("error");
      };
      if (number.length < 13 || !luhnOk(number)) return fail("Número do cartão inválido.");
      if (!holderName) return fail("Informe o nome impresso no cartão.");
      if (!mm || !yy || yy.length !== 2 || month < 1 || month > 12) return fail("Validade inválida. Use o formato MM/AA.");
      const now = new Date();
      if (year < now.getFullYear() || (year === now.getFullYear() && month < now.getMonth() + 1)) return fail("Cartão vencido.");
      if (cvv.length < 3) return fail("CVV inválido.");

      payload.card = { number, holderName, cvv, expirationMonth: String(month).padStart(2, "0"), expirationYear: String(year) };
      payload.installments = Number(document.getElementById("cardInstallments").value) || 1;
    }

    const submitBtn = document.getElementById("orderSubmit");
    submitBtn.disabled = true;
    submitBtn.textContent = "Processando...";

    try {
      const data = await API.post("/orders", payload);

      if (selectedPayment === "credit_card") {
        // Stripe devolve a URL do checkout hospedado; no cartão direto (Plumify)
        // o pedido já volta com o status e vamos para a página de confirmação.
        window.location.href = data.checkoutUrl || `/pedido-confirmado.html?order=${data.order.id}`;
        return;
      }

      document.getElementById("orderForm").style.display = "none";
      const resultBox = document.getElementById("pixResult");
      resultBox.style.display = "block";
      document.getElementById("pixAmount").textContent = formatBRL(currentProduct.price);
      document.getElementById("pixCode").value = data.pix.qrCode || "Código não disponível.";
      if (data.pix.qrCodeBase64) {
        document.getElementById("pixQr").src = `data:image/png;base64,${data.pix.qrCodeBase64}`;
      }
      document.getElementById("copyPix").addEventListener("click", () => {
        navigator.clipboard.writeText(data.pix.qrCode || "");
        document.getElementById("copyPix").textContent = "Código copiado!";
      });
    } catch (err) {
      errorBox.textContent = err.message || "Não foi possível processar o pedido.";
      errorBox.classList.add("error");
      submitBtn.disabled = false;
      submitBtn.textContent = submitLabel();
    } finally {
      clearCardFields(); // não deixa dados do cartão parados na página
    }
  }

  async function init() {
    const slug = qs("slug");
    if (!slug) {
      document.getElementById("productWrap").innerHTML = `<div class="empty-state">Produto não especificado.</div>`;
      return;
    }
    try {
      try {
        const cfg = await API.get("/config");
        cardMode = cfg.cardCheckout === "form" ? "form" : "redirect";
      } catch (e) { /* mantém o padrão (redirect) */ }
      const data = await API.get(`/products/${encodeURIComponent(slug)}`);
      currentProduct = data.product;
      renderProduct(currentProduct);
    } catch (e) {
      document.getElementById("productWrap").innerHTML = `<div class="empty-state">Produto não encontrado.</div>`;
    }
  }

  init();
</script>
</body>
</html>
